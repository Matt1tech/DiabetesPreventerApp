name: Security and quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-change-me-2026
      DATABASE_ENGINE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python manage.py check --deploy
        working-directory: backend
      - run: pytest
        working-directory: backend
      - run: bandit -q -c pyproject.toml -r api backend
        working-directory: backend
      - run: ruff check api backend
        working-directory: backend
      - run: pip-audit -r requirements.txt
        working-directory: backend

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      # The inherited prototype has a lint backlog; errors remain fatal while
      # warnings and informational modernization hints are reported visibly.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
